name: probe
# Every hour: re-probe every LayerZero adapter over Aave-listed tokens on 8 chains (simulated inbound messages from the
# real endpoint, eth_call only). Commits docs/evidence/inbound/latest-*.json; the deploy workflow republishes the site.
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: probe
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: scripts/probe-all.sh
      - name: Keep good results if this run came back partial
        run: python3 scripts/guard-probe.py
      - name: Commit results
        run: |
          git config user.name "floor-scheduler"
          git config user.email "floor-scheduler@users.noreply.github.com"
          git add docs/evidence/inbound/latest-*.json
          git diff --cached --quiet || (git commit -m "probe: hourly inbound re-probe $(date -u +%Y-%m-%dT%H:%MZ)" && git pull --rebase -q && git push)
