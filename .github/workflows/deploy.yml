name: deploy
# Every push to main: build the one static site (scripts/build-site.sh) and publish it twice:
#   1. GitHub Pages at the custom domain in packages/deployments/testnet.json (floor.aexiz.in)
#   2. Swarm, through the public gateway (no server; the bzz.limo URL is printed in the job summary)
on:
  push:
    branches: [main]
  workflow_run:
    # pushes made by the scheduler (GITHUB_TOKEN) do not trigger workflows, so redeploy when it finishes
    workflows: [watch, probe]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: scripts/build-site.sh
        env:
          VITE_ARKIV_ACCESS_KEY: ${{ vars.ARKIV_ACCESS_KEY }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Publish to Swarm (public gateway)
        continue-on-error: true
        run: |
          tar -C site -cf site.tar .
          REF=$(curl -s -m 180 -X POST https://api.gateway.ethswarm.org/bzz -H "Content-Type: application/x-tar" -H "Swarm-Collection: true" -H "Swarm-Index-Document: index.html" --data-binary @site.tar | jq -r .reference)
          CID=$(python3 -c "import base64,sys;r=bytes.fromhex(sys.argv[1]);print('b'+base64.b32encode(bytes([1,0xfa,1,0x1b,0x20])+r).decode().lower().rstrip('='))" "$REF")
          echo "Swarm reference: \`$REF\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Swarm URL: https://$CID.bzz.limo/" >> "$GITHUB_STEP_SUMMARY"
          echo "Swarm reference: $REF"
          echo "Swarm URL: https://$CID.bzz.limo/"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
